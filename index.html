<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iterum Technologies</title>
    <meta
      name="description"
      content="Iterum Technologies is a California-based software company building productivity tools for small and mid-sized service businesses. Our first product, AlloTalk, is a push-to-talk app that keeps teams connected in the field."
    />

    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="brand" href="/">
          <img src="logo.svg" alt="Iterum Technologies" />
        </a>
        <a class="btn btn-primary" href="mailto:hello@iterumtech.com"
          >Contact</a
        >
      </div>
    </header>

    <main class="hero">
      <div class="container">
        <p class="hero-phrase">
          Iterum Technologies builds communication and productivity software for
          businesses. Its first product, <strong>AlloTalk</strong>, is a
          push-to-talk app for crews that want to stay connected in the field.
        </p>

        <div class="divider"></div>

        <div class="promo">
          <img src="allotalk.svg" alt="AlloTalk" />
          <a
            class="btn btn-cta"
            href="https://app.allotalk.us"
            target="_blank"
            rel="noopener noreferrer"
          >
            Try AlloTalk today
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M5 12h14M13 6l6 6-6 6"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </a>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <span class="footer-copyright"
          >&copy; Iterum Technologies LLC <span id="year"></span
        ></span>
        <span class="footer-sep">|</span>
        <span class="footer-links">
          <a href="privacy/">Privacy</a>
          <a href="terms/">Terms</a>
        </span>
      </div>
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
